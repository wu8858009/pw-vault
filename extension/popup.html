<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>帳號密碼紀錄 PRO</title>
<style>
  :root { --p: #2f5bea; --line: #e3e8ef; --muted: #64748b; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; font: 13.5px "Microsoft JhengHei UI", "Segoe UI", system-ui, sans-serif; color: #0f172a; background: #f4f6fa; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: #0b1324; color: #fff; font-weight: 700; }
  header img { width: 22px; height: 22px; border-radius: 6px; }
  header b { background: linear-gradient(#ffd27a, #f4b740); color: #1a1300; border-radius: 4px; padding: 0 5px; font-size: 10px; }
  header .v { margin-left: auto; font-weight: 400; font-size: 12px; color: #9fb0cc; }
  main { padding: 12px; }
  .msg { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; line-height: 1.6; color: #334155; }
  .code { font: 700 26px Consolas, monospace; letter-spacing: .3em; text-align: center; margin: 10px 0; color: var(--p); }
  button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button.p { background: var(--p); border-color: var(--p); color: #fff; }
  button.sm { padding: 3px 8px; font-size: 12px; }
  input { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .list { margin-top: 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; max-height: 320px; overflow-y: auto; }
  .it { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-top: 1px solid #eef1f6; }
  .it:first-child { border-top: 0; }
  .av { width: 28px; height: 28px; border-radius: 7px; background: var(--p); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
  .m { flex: 1; min-width: 0; } .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ops { display: flex; gap: 4px; }
  .lbl { font-size: 12px; color: var(--muted); margin: 12px 2px 6px; }
  .foot { display: flex; gap: 8px; margin-top: 12px; }
  .foot button { flex: 1; }
  .empty { padding: 14px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<header><img src="icons/32.png" alt="">帳號密碼紀錄 <b>PRO</b><span class="v" id="vault"></span></header>
<main id="main"><div class="msg">連線中…</div></main>
<script src="popup.js"></script>
</body>
</html>
